[project]
name = "django-admin-boost"
version = "0.1.0a1"
description = "Performance-oriented Django admin extensions."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
keywords = []
authors = [{ name = "Oliver Haas", email = "ohaas@e1plus.de" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Framework :: Django",
  "Framework :: Django :: 5.2",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["Django>=5.2,<7", "django-stubs-ext>=5.0"]

[project.optional-dependencies]
jinja2 = ["Jinja2>=3.1"]

[project.urls]
Changelog = "https://oliverhaas.github.io/django-admin-boost/reference/changelog/"
Documentation = "https://oliverhaas.github.io/django-admin-boost/"
Homepage = "https://github.com/oliverhaas/django-admin-boost"
Repository = "https://github.com/oliverhaas/django-admin-boost.git"

[dependency-groups]
dev = [
  "beautifulsoup4==4.15.0",
  "django-stubs==6.1.0",
  "Jinja2==3.1.6",
  "mypy==2.3.1",
  "pre-commit==4.6.2",
  "pytest-cov==7.1.0",
  "pytest-django==4.14.0",
  "pytest-xdist==3.8.0",
  "pytest==9.1.1",
  "ruff==0.16.4",
]
docs = ["mike==2.2.0", "mkdocs==1.6.1", "mkdocs-material==9.7.7"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["django_admin_boost"]

[tool.hatch.build.targets.sdist]
include = ["django_admin_boost", "LICENSE", "README.md"]

[tool.ruff]
target-version = "py313"
line-length = 120
fix = true
extend-exclude = [
  "examples",
  # Copied from django-unfold — not our code to lint
  "django_admin_boost/admin/contrib/",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "D", "E501", "EM", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"django_admin_boost/boost/*.py" = [
  "ANN",
  "ARG",
  "FBT",
  "PERF401",
  "PLC0415",
  "PLR2004",
  "RUF012",
  "SIM110",
  "TC002",
]
"tests/**" = [
  "ANN",
  "ARG",
  "F841",
  "FBT",
  "PLC0415",
  "PLR2004",
  "PT006",
  "PT011",
  "PT013",
  "PT018",
  "RUF012",
  "B905",
  "C901",
  "RET504",
  "RUF059",
  "S101",
  "S105",
  "S106",
]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
pretty = true
python_version = "3.12"
show_error_codes = true
show_error_context = true
warn_redundant_casts = true
warn_unused_ignores = true


[[tool.mypy.overrides]]
# Copied from django-unfold — not our code to type-check
module = ["django_admin_boost.admin.contrib.*"]
ignore_errors = true

[tool.django-stubs]
django_settings_module = "tests.settings.base"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "settings.base"
addopts = "--cov=django_admin_boost --cov-report=term-missing --cov-report=xml --no-cov-on-fail"
pythonpath = ["tests"]
testpaths = ["tests"]
xfail_strict = true

[tool.coverage.run]
omit = ["tests/*"]

[tool.coverage.report]
precision = 2
skip_covered = true
